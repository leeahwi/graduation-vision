name: Verify graduation projects

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check Python syntax and ROS XML
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path("ros-lane-detection")
          for path in [*sorted(root.glob("src/*.py")), *sorted(Path("scripts").glob("*.py"))]:
              compile(path.read_bytes(), str(path), "exec")
              print("Python syntax:", path)
          for path in [root / "package.xml", *sorted(root.glob("launch/*.launch"))]:
              ET.parse(path)
              print("XML syntax:", path)
          PYTHON
  cpp-build:
    needs: source-checks
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install existing project dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ libopencv-dev libgsl-dev
      - name: Configure and build both C++ programs
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
      - name: Check unavailable input fails without camera access
        run: |
          python3 - <<'PYTHON'
          import subprocess
          checks = [
              ["./build/lane-detection/Live_LaneDetection", "/nonexistent/graduation-input.mp4"],
              ["./build/object-detection/Live_ObjectDetection", "/nonexistent/coco.names"],
          ]
          for command in checks:
              result = subprocess.run(command, stdin=subprocess.DEVNULL, timeout=15)
              assert result.returncode == 1, (command, result.returncode)
              print("Missing input handled:", command[0])
          PYTHON
      - name: Restore and verify original release data
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-data
          gh release download v1.0.0 --repo "$GITHUB_REPOSITORY" --dir release-data --pattern 'graduation-vision-sample-videos.tar.gz' --pattern 'graduation-vision-yolov5-assets.tar.gz'
          python3 scripts/fetch-release-data.py --archive-dir release-data
      - name: Package executables, data and catkin sources
        if: github.event_name != 'pull_request'
        run: |
          bash scripts/package-release.sh
          (cd dist && sha256sum -c SHA256SUMS)
          mkdir release-smoke
          tar -C release-smoke -xzf dist/graduation-vision-ubuntu-22.04-x86_64.tar.gz
          file release-smoke/graduation-vision-ubuntu-22.04-x86_64/bin/*
          python3 - <<'PYTHON'
          import subprocess
          binary = "./release-smoke/graduation-vision-ubuntu-22.04-x86_64/bin/"
          for name in ["Live_LaneDetection", "Live_ObjectDetection"]:
              result = subprocess.run([binary + name, "/nonexistent/input"], timeout=15)
              assert result.returncode == 1, (name, result.returncode)
          PYTHON
      - name: Keep downloadable build artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: graduation-vision-release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Prepare draft release for a version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "Graduation Vision $GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" dist/* --clobber
